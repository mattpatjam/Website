name = "health-dashboard"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare's own request logs only. No third-party analytics anywhere.
[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "health"
# Replace after running: npx wrangler d1 create health
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# One cron, every 30 minutes (UTC). The job itself decides what to do:
#  - calendar sync (if the last one is older than ~55 min)
#  - recompute recent daily metrics + readiness
#  - generate today's recommendations once it is past 06:30 Bali time
[triggers]
crons = ["*/30 * * * *"]

[vars]
# Model for daily recommendations. Override here if you want a cheaper one.
CLAUDE_MODEL = "claude-opus-5-5"

# Secrets (set with `npx wrangler secret put NAME`, never commit them):
#   INGEST_TOKEN          long random string; Health Auto Export sends it as a header
#   DASHBOARD_PASSWORD    your login password
#   SESSION_SECRET        long random string used to sign the session cookie
#   GOOGLE_CLIENT_ID      Google OAuth client (Web application)
#   GOOGLE_CLIENT_SECRET
#   ANTHROPIC_API_KEY
